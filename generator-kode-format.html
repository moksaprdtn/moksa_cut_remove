<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Premium Format - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Pustaka Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --dark-navy: #0b1329;
            --deep-black: #050814;
            --accent-navy: #1d2d50;
            --card-dark: #111a36;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --blue-glow: rgba(59, 130, 246, 0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, var(--deep-black), var(--dark-navy)); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .admin-card { background-color: var(--card-dark); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 16px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px var(--blue-glow); }
        h2 { font-size: 1.3rem; margin-bottom: 8px; color: var(--text-main); }
        p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; }
        .code-display-box { background: var(--deep-black); border: 2px dashed rgba(59, 130, 246, 0.4); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .code-text { font-family: monospace; font-size: 1.25rem; font-weight: bold; color: #60a5fa; letter-spacing: 1px; margin-bottom: 10px; word-break: break-all; }
        .meta-info { font-size: 0.8rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 4px; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .btn { padding: 12px 20px; border-radius: 50px; border: none; font-weight: 600; cursor: pointer; transition: all 0.3s ease; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, #1d4ed8, #2563eb); color: white; box-shadow: 0 4px 15px rgba(37, 99, 235,.4); }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-secondary { background: var(--accent-navy); color: white; }
        .btn-secondary:hover { background: #273e6b; }
    </style>
</head>
<body>
    <div class="admin-card">
        <h2>GENERATOR PREMIUM FORMAT</h2>
        <p>Hasilkan satu kode unik kriptografis untuk membuka akses format PNG dan JPEG.</p>
        
        <div class="code-display-box">
            <div id="codeOutput" class="code-text">&lt; KODE UNIK YANG DIHASILKAN &gt;</div>
            <div class="meta-info">
                <span>Kategori: <strong>PREMIUM FORMAT</strong></span>
                <span>Status: <strong id="statusOutput" style="color:#f59e0b;">BELUM DIGUNAKAN</strong></span>
                <span>Waktu dibuat: <strong id="timeOutput">-</strong></span>
            </div>
        </div>

        <div class="btn-group">
            <button id="generateBtn" class="btn btn-primary"><i class="fa-solid fa-key"></i> GENERATE CODE</button>
            <button id="copyBtn" class="btn btn-secondary" disabled><i class="fa-solid fa-copy"></i> COPY CODE</button>
            <button id="generateNewBtn" class="btn btn-secondary" style="display:none;"><i class="fa-solid fa-rotate"></i> GENERATE NEW CODE</button>
        </div>
    </div>

    <script>
        // Masukkan URL dan Key Supabase Anda di sini
        const SUPABASE_URL = "https://gtvctshbamzndjppisdz.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0dmN0c2hiYW16bmRqcHBpc2R6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNzc1NDksImV4cCI6MjEwODY1MzU0OX0.8GZwmpxGgGKJxGBc9W-kBmxeba7oNaNnSjjwVEYQi70";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const generateBtn = document.getElementById('generateBtn');
        const generateNewBtn = document.getElementById('generateNewBtn');
        const copyBtn = document.getElementById('copyBtn');
        const codeOutput = document.getElementById('codeOutput');
        const statusOutput = document.getElementById('statusOutput');
        const timeOutput = document.getElementById('timeOutput');
        
        let currentGeneratedCode = '';

        function generateSecureCode(prefix) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const randomValues = new Uint8Array(12);
            crypto.getRandomValues(randomValues);
            let result = prefix + '-';
            for (let i = 0; i < 12; i++) {
                result += chars[randomValues[i] % chars.length];
            }
            return result;
        }

        async function createAndSaveCode() {
            try {
                const newCode = generateSecureCode('FMT');
                const createdAt = new Date().toISOString();

                // Simpan langsung ke database Supabase
                const { error } = await supabaseClient
                    .from('licenses')
                    .insert([
                        { code: newCode, category: 'PREMIUM FORMAT', status: 'BELUM DIGUNAKAN', created_at: createdAt }
                    ]);

                if (error) throw error;

                currentGeneratedCode = newCode;
                codeOutput.textContent = newCode;
                statusOutput.textContent = 'BELUM DIGUNAKAN';
                timeOutput.textContent = new Date(createdAt).toLocaleString('id-ID');
                copyBtn.disabled = false;
                generateBtn.style.display = 'none';
                generateNewBtn.style.display = 'flex';

            } catch (err) {
                alert('Gagal menghasilkan kode ke Supabase: ' + err.message);
            }
        }

        generateBtn.addEventListener('click', createAndSaveCode);
        generateNewBtn.addEventListener('click', createAndSaveCode);

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(currentGeneratedCode);
            alert('Kode berhasil disalin ke clipboard!');
        });
    </script>
</body>
</html>
